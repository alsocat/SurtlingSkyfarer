# Surtling Skyfarer settings — edit with any text editor before starting the game/server.
# Keep this file beside Wise.Skyfarer.dll. Restart after changing it.
# Multiplayer: the server's settings apply to everyone; local games use this file.
# When updating, preserve your edited copy instead of replacing it with defaults.

[Aircraft]

# False keeps the plane indestructible, as in previous versions (default).
# True enables damage from attacks, fire, and collisions; the plane can break.
# Repair with the hammer. Unsupported flight and roofless exposure do not cause wear.
# Restart after editing; the server's settings apply to everyone.
DurabilityEnabled = false

# Maximum plane health. Default: 1800. Allowed: 1 to 1000000.
# Existing planes keep their health percentage when this changes (50% stays 50%).
# Disabling durability stops damage but does not automatically repair the plane.
# Restart after editing.
MaxHealth = 1800

# Powered target speed in metres per second. Default: 22. Allowed: 10 to 100.
# Affects forward flight and wheels; reverse remains 4 m/s.
# Dedicated servers may struggle at 100 m/s. Lower TopSpeed if you notice lag
# or rubber-banding; start with the default 22 m/s and increase gradually.
# This is not a hard cap on falling or collision speeds. Use a dot for decimals.
TopSpeed = 22

# Comma-separated ItemPrefab:amount pairs. Names are case-sensitive.
# Default: 80 Fine Wood, 25 Copper, 20 Deer Hide, 8 Surtling Cores.
# You may substitute materials, e.g. Wood:100,Iron:30,SurtlingCore:8
# Use 1–16 different items, each with an amount from 1 to 10000.
# Invalid recipes fall back to the default recipe and log a warning.
# Dismantling refunds use the current recipe, including for existing planes.
Recipe = FineWood:80,Copper:25,DeerHide:20,SurtlingCore:8
